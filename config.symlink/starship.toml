format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_status\
$git_state\
$cmd_duration\
$line_break\
$python\
$character"""

[directory]
style = "blue"

[character]
error_symbol = "[❯](red)"
success_symbol = "[❯](green)"
vicmd_symbol = "[❮](purple)"

[git_branch]
format = '[$branch]($style)'
style = "bright-black"
# On a detached HEAD show only git_commit's hash, not a literal "HEAD".
only_attached = true

# Shows the short hash on a detached HEAD, where git_branch shows nothing.
[git_commit]
format = '[$hash]($style)'
style = "bright-black"

[git_status]
format = '([ $conflicted$staged$modified$untracked$ahead_behind]($style))'
style = "cyan"
conflicted = "="
staged = "+"
modified = "*"
untracked = "?"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↑${ahead_count}↓${behind_count}"
ignore_submodules = true

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
