#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Andreas Eldh"
email = "andreas.eldh@gmail.com"

[ui]
default-command = "log"
diff-editor = ":builtin"

[aliases]
l   = ["log", "-r", "ancestors(reachable(@, mutable()), 4) | trunk()"]
ll  = ["log"]
s   = ["status"]
d   = ["diff"]
n   = ["new"]
e   = ["edit"]
b   = ["bookmark"]
tug = ["bookmark", "move", "--from", "closest_bookmark(@-)", "--to", "@-"]

[revset-aliases]
"closest_bookmark(to)" = "heads(::to & bookmarks())"
# trunk() left as builtin — auto-detects main/master/trunk@origin per repo.
